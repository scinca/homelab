---
- name: Update Debian 13 servers
  hosts: homelab
  become: true
  gather_facts: false
  tasks:
    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: "full"
        autoremove: true
        autoclean: true

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Print reboot status
      ansible.builtin.reboot:
        msg: "A reboot was initiated by ansible!"
      when: reboot_flag.stat.exists
