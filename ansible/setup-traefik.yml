---
- name: Deploy Traefik
  hosts: homelab
  become: true
  gather_facts: false
  vars:
    services_root: /opt/services

  tasks:
    - name: Ensure service directories exist
      ansible.builtin.file:
        path: "{{ services_root }}/traefik"
        state: directory
        mode: '0755'

    - name: Ensure acme.json exists with correct permissions
      ansible.builtin.file:
        path: "{{ services_root }}/traefik/acme.json"
        state: touch
        owner: root
        group: root
        mode: '0600'

    - name: Copy compose file and configs
      ansible.builtin.copy:
        src: "../services/traefik/"
        dest: "{{ services_root }}/traefik/"
        mode: '0644'

    - name: Render .env files
      ansible.builtin.template:
        src: "../services/traefik/env.j2"
        dest: "{{ services_root }}/traefik/.env"
        mode: '0600'
        no_log: true

    - name: Deploy/update service
      community.docker.docker_compose_v2:
        project_src: "{{ services_root }}/traefik"
        state: present
        remove_orphans: true
