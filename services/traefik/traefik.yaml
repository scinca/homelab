global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: ERROR

api:
  dashboard: false
  insecure: false

entrypoints:
  web:
    address: "[::]:80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: "[::]:443"


  metrics:
    address: :8082

certificatesResolvers:
  cloudflare:
    acme:
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: frontend

  file:
    filename: /etc/traefik/dynamic.yaml
    watch: true

metrics:
  addInternals: true
  prometheus:
    buckets:
     - 0.1
     - 0.3
     - 1.2
     - 5.0
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
